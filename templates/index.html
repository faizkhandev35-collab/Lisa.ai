<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisa</title>
<style>
:root{
  --bg:#FAF9F5;--side:#F0EEE6;--bubble:#F0EEE6;--text:#141413;
  --muted:#73726C;--line:rgba(31,30,29,.15);--accent:#D97757;--accent-d:#C6613F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#side{width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px 12px;flex-shrink:0;
  position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .25s ease;z-index:30}
#side.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.2)}
#scrim{display:none;position:fixed;inset:0;background:rgba(20,20,19,.4);z-index:25}
#scrim.open{display:block}
.brand{font-size:20px;font-weight:600;color:var(--accent);padding:6px 8px 16px}
#newBtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-weight:500;font-size:14.5px;color:var(--accent-d);margin-bottom:8px}
#newBtn:hover{background:rgba(217,119,87,.12)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 12px;border-radius:9px;font-size:14px;text-align:left;width:100%}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:rgba(127,124,110,.16)}
.item .del{opacity:0;color:var(--muted);font-size:16px;padding:0 4px}
.item:hover .del{opacity:1}

main{flex:1;display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line)}
#menuBtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center}
#menuBtn:hover{background:rgba(127,124,110,.15)}
header h1{font-size:16px;font-weight:600;color:var(--accent)}

#msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px;max-width:720px;margin:0 auto;width:100%}
.u{align-self:flex-end;background:var(--bubble);padding:10px 15px;border-radius:15px;max-width:80%;font-size:15.5px;line-height:1.5;white-space:pre-wrap}
.a{max-width:85%;line-height:1.65;font-size:15.5px;white-space:pre-wrap}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35;animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

#comp{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px}
.box:focus-within{border-color:rgba(217,119,87,.6)}
#inp{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15.5px;padding:8px 0;resize:none;max-height:140px}
#send{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
#send:hover{background:var(--accent-d)}
#send svg{width:18px;height:18px}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">Lisa</div>
  <button id="newBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <div id="list"></div>
</aside>
<div id="scrim"></div>

<main>
  <header>
    <button id="menuBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1>Lisa</h1>
  </header>
  <div id="msgs"></div>
  <div id="comp">
    <div class="box">
      <textarea id="inp" rows="1" placeholder="Message Lisa..."></textarea>
      <button id="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
let curId = null;
let busy = false;

async function loadChats(){
  const r = await fetch('/api/chats');
  const chats = await r.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === curId ? ' on' : '');
    d.innerHTML = '<span></span><span class="del" data-del="'+c.id+'">&times;</span>';
    d.firstChild.textContent = c.title;
    d.onclick = e => {
      if (e.target.dataset.del){
        fetch('/api/chats/'+e.target.dataset.del, {method:'DELETE'}).then(()=>{
          if (curId == e.target.dataset.del) curId = null;
          document.getElementById('msgs').innerHTML = '';
          loadChats();
        });
        return;
      }
      openChat(c.id);
      closeSide();
    };
    list.appendChild(d);
  });
}

async function newChat(){
  const r = await fetch('/api/chats', {method:'POST'});
  const d = await r.json();
  curId = d.id;
  document.getElementById('msgs').innerHTML = '';
  loadChats();
  closeSide();
}

async function openChat(id){
  curId = id;
  const r = await fetch('/api/chats/'+id+'/messages');
  const msgs = await r.json();
  const box = document.getElementById('msgs');
  box.innerHTML = '';
  msgs.forEach(m => {
    const d = document.createElement('div');
    d.className = m.role === 'user' ? 'u' : 'a';
    d.textContent = m.text;
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
  loadChats();
}

function scrollEnd(){
  const box = document.getElementById('msgs');
  box.scrollTop = box.scrollHeight;
}

async function send(){
  if (busy) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  if (!curId){
    const r = await fetch('/api/chats', {method:'POST'});
    const d = await r.json();
    curId = d.id;
  }
  const box = document.getElementById('msgs');
  const u = document.createElement('div');
  u.className = 'u'; u.textContent = text;
  box.appendChild(u);
  inp.value = ''; inp.style.height = 'auto';
  scrollEnd();

  const a = document.createElement('div');
  a.className = 'a';
  a.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  box.appendChild(a);
  scrollEnd();

  busy = true;
  let full = '';
  try {
    const res = await fetch('/api/chats/'+curId+'/messages/stream', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines){
        if (!line.startsWith('data:')) continue;
        const payload = JSON.parse(line.slice(5).trim());
        if (payload.chunk){
          full += payload.chunk;
          a.textContent = full;
          scrollEnd();
        }
      }
    }
  } catch(e){
    a.textContent = 'Connection error. Please try again.';
  }
  busy = false;
  loadChats();
}

document.getElementById('send').onclick = send;
document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.getElementById('inp').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
document.getElementById('newBtn').onclick = newChat;
document.getElementById('menuBtn').onclick = () => {
  document.getElementById('side').classList.add('open');
  document.getElementById('scrim').classList.add('open');
};
function closeSide(){
  document.getElementById('side').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
document.getElementById('scrim').onclick = closeSide;

loadChats();
</script>
</body>
</html>
